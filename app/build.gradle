plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'org.dydlakcloud.resticopia'

    compileSdkVersion 36

    defaultConfig {
        applicationId namespace
        minSdkVersion 24
        targetSdkVersion 36
        
        // Version information from gradle.properties
        // Build will fail if VERSION_CODE or VERSION_NAME are not defined
        versionCode Integer.parseInt(VERSION_CODE)
        versionName VERSION_NAME
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            // Only configure signing if environment variables are set
            if (System.env.RELEASE_STORE_FILE) {
                storeFile file(System.env.RELEASE_STORE_FILE)
                storePassword System.env.RELEASE_STORE_PASSWORD
                keyAlias System.env.RELEASE_KEY_ALIAS
                keyPassword System.env.RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            // Only use custom signing config if RELEASE_STORE_FILE is set
            if (System.env.RELEASE_STORE_FILE) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Reproducible build configurations for F-Droid
            // Disable PNG crunching as it's non-deterministic
            crunchPngs false
            
            // R8 settings for deterministic builds (if minify is enabled)
            // These ensure consistent output across different build environments
            shrinkResources false
        }
        debug {
            // Also disable PNG crunching in debug builds for consistency
            crunchPngs false
        }
    }
    
    // Additional reproducible build settings
    aaptOptions {
        // Disable PNG crunching globally for deterministic builds
        cruncherEnabled = false
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            all {
                it.enabled = true
            }
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        // Ensure consistent ordering for reproducible builds
        pickFirst 'META-INF/*'
    }
    
    // Store TTF/OTF files uncompressed for reproducible builds
    androidResources {
        noCompress 'ttf', 'otf'
    }
    splits {
        abi {
            enable true
            reset()
            // Only include architectures we actually have native libraries for
            include 'arm64-v8a'
            // Universal APK disabled by default to save build time and memory
            // Enable only if you need it for distribution
            universalApk false
        }
    }
    
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

kotlin {
    compilerOptions {
        //noinspection UnnecessaryQualifiedReference
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abiFilter = output.filters.find { it.filterType.toString() == 'ABI' }
            def abiName = abiFilter != null ? abiFilter.identifier : 'universal'
            def isSigned = variant.signingConfig != null && variant.signingConfig.storeFile.isPresent()
            def signingSuffix = isSigned ? "" : '-unsigned'
            output.outputFileName.set("resticopia-${VERSION_NAME}-${abiName}-${variant.name}${signingSuffix}.apk")
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'androidx.security:security-crypto:1.1.0'
    
    // Unit Testing Dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.14.9'
    testImplementation 'io.mockk:mockk-android:1.14.9'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'app.cash.turbine:turbine:1.2.1'
    testImplementation 'com.google.truth:truth:1.4.5'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    
    // Android Testing Dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'io.mockk:mockk-android:1.14.9'
}

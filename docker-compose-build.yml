services:
  native-build:
    image: debian:bookworm
    platform: linux/amd64 # Keep amd64 for testing, use arm64 for production F-Droid builds
    container_name: native-build
    working_dir: /build
    tty: true
    environment:
      DEBIAN_FRONTEND: noninteractive
      ANDROID_NDK_HOME: /opt/android-ndk
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Pin the Go toolchain version to match the F-Droid srclibs pin
      # (metadata/org.dydlakcloud.resticopia.yml -> srclibs: go@goX.Y.Z).
      # This MUST stay in sync with that pin for reproducible builds.
      # See: https://codeberg.org/dawdyd/resticopia/issues/89
      GO_VERSION: "1.25.8"
      GOTOOLCHAIN: "local"
      SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
      TZ: UTC
    volumes:
      - .:/build
      - build-cache:/build/sources # Cache source repositories
    command: >
      bash -c "
        set -euo pipefail

        echo '📦 Installing system dependencies...'
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl wget git make pkg-config build-essential file unzip python3 gawk
        echo '✅ Base dependencies installed'

        echo '📦 Installing development libraries...'
        apt-get install -y -qq --no-install-recommends libarchive-dev uthash-dev swig xsltproc strace
        echo '✅ Development libraries installed'

        echo '📦 Installing pinned Go toolchain (must match F-Droid srclibs pin for reproducible builds)...'
        # IMPORTANT: The Go version below (1.25.8) MUST match the srclibs
        # go@go1.25.8 pin in the F-Droid metadata YAML. F-Droid compiles that
        # exact Go version from source, so we must use the identical version
        # here or the compiled .so binaries (libdata_restic.so, libdata_rclone.so)
        # will differ and the F-Droid reproducible-build verification will fail.
        # See: https://codeberg.org/dawdyd/resticopia/issues/89
        if ! go version 2>/dev/null | grep -q go1.25.8; then
          echo 'Installing Go 1.25.8 from official tarball...'
          curl -sSfL https://go.dev/dl/go1.25.8.linux-amd64.tar.gz -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          rm -f /tmp/go.tar.gz
        else
          echo 'Go 1.25.8 already installed'
        fi
        export PATH=/usr/local/go/bin:$$PATH
        echo 'Using Go:'
        go version
        echo '✅ Pinned Go toolchain installed'

        echo '📦 Installing Android NDK...'
        if [ ! -d "/opt/android-ndk" ]; then
          mkdir -p /opt
          cd /opt
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q ndk.zip
          mv android-ndk-r26b android-ndk
          rm ndk.zip
          echo '✅ Android NDK installed'
        else
          echo '✅ Android NDK already exists, skipping installation'
        fi

        update-ca-certificates
        echo '🎯 Starting build-go-binaries.sh process (includes PRoot now)...'
        chmod +x /build/build-go-binaries.sh
        chmod +x /build/build-native-binaries.sh
        /build/build-go-binaries.sh
        echo '🎯 Build completed successfully!'
      "

volumes:
  build-cache:
    driver: local
